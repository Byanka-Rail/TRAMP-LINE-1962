plugins {
    id 'com.android.application'
}

android {
    namespace 'com.byankarail.trampline1962'
    compileSdk 35

    defaultConfig {
        applicationId "com.byankarail.trampline1962"
        minSdk 26
        targetSdk 35
        versionCode 220
        versionName "2.2.0"
    }

    signingConfigs {
        ciDebug {
            storeFile file('trampline-ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ciDebug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.ciDebug
        }
    }
}

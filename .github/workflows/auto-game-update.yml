name: Auto publish TRAMP LINE update

# 포병(FIRE DIRECTION LAB)과 같은 방식:
#  - 저장소 최상위에 TRAMP_LINE_1962_v<판>.html 을 올린다
#  - 가장 높은 판을 index.html 로 복사한다 (이미 깔린 앱은 index.html 을 보고 갱신한다 — APK 재설치 불필요)
#  - 판 HTML 은 최근 10개만 남긴다
#  - update.json 을 갱신한다
#  - 내용이 바뀌면 판 번호를 올린다 (같은 번호면 기기에 업데이트가 안 뜬다)

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: tramp-line-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh index.html / update.json / keep latest 10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          root = Path(".")
          rx = re.compile(r"^TRAMP_LINE_1962_v(\d+)\.(\d+)\.(\d+)\.html$", re.I)
          inner = re.compile(r"TRAMP_LINE_CONTENT_VERSION\s*=\s*['\"]([^'\"]+)['\"]")

          found = []
          for p in root.glob("TRAMP_LINE_1962_v*.html"):
              m = rx.match(p.name)
              if m:
                  found.append((tuple(map(int, m.groups())), p))

          if not found:
              print("판 HTML(TRAMP_LINE_1962_v*.html)이 최상위에 없어 아무것도 건드리지 않습니다.")
              raise SystemExit(0)

          found.sort(key=lambda x: x[0])
          (major, minor, patch), game = found[-1]
          version = f"{major}.{minor}.{patch}"

          # 앱은 파일 안의 TRAMP_LINE_CONTENT_VERSION 으로 판단한다 — 파일 이름과 다르면 멈춘다
          head = game.read_bytes()[:1_048_576].decode("utf-8", "ignore")
          m = inner.search(head)
          if not m:
              raise SystemExit(f"{game.name}: 앞 1MB 안에 TRAMP_LINE_CONTENT_VERSION 이 없습니다.")
          if m.group(1).strip() != version:
              raise SystemExit(
                  f"{game.name}: 파일 이름 판({version})과 안쪽 TRAMP_LINE_CONTENT_VERSION({m.group(1)})이 다릅니다."
              )

          # 최신 판 → index.html (이미 깔린 앱이 이 파일을 본다)
          shutil.copyfile(game, "index.html")

          # 최근 10개만 남긴다
          for _, old in found[:-10]:
              print(f"remove {old.name}")
              old.unlink()

          build = major * 1_000_000 + minor * 1_000 + patch
          data = {
              "version": version,
              "build": build,
              "file": game.name,
              "sha256": hashlib.sha256(game.read_bytes()).hexdigest(),
              "notes": f"TRAMP LINE 1962 v{version}",
              "mandatory": False,
          }
          Path("update.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"version = {version} · build = {build} · file = {game.name}")
          PY

      - name: Commit if changed
        shell: bash
        run: |
          git add -A -- index.html update.json 'TRAMP_LINE_1962_v*.html'
          if git diff --cached --quiet; then
            echo "already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish latest TRAMP LINE update"
          git push
